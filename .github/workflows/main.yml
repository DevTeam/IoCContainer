name: IoCContainer check

on:
  push:
    branches: [ master ]
    paths-ignore: &docs
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

# A newer push to a branch or a pull request cancels its older run; every master commit is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # A check build never publishes, so any version that sorts after the released ones is enough.
  PACKAGE_VERSION: 1.0.0-ci.${{ github.run_number }}

# The solution targets .NET Framework 4.0/4.8 and the newest .NET, so it is built on Windows,
# where both .NET Framework reference assemblies and the .NET SDK are available.
jobs:
  build:
    name: build, test and pack
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.Build.props', '**/*.csproj', '**/*.nuspec') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build IoC.sln --configuration Release --property:version=${{ env.PACKAGE_VERSION }} -verbosity:minimal

      # Runs IoC.Tests and IoC.Performance.Tests for every target framework of the test projects.
      - name: Test
        run: dotnet test IoC.sln --configuration Release --no-build --logger trx --results-directory artifacts/test-results

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

      # Packing validates the nuspec driven packages and shows the assets of every package.
      - name: Pack
        run: dotnet pack IoC.sln --configuration Release --no-build --property:version=${{ env.PACKAGE_VERSION }} --output artifacts/packages

      - name: Save NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7
